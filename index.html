<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的單車軌跡地圖</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.1.2/gpx.min.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .gpx-info { font-size: 14px; line-height: 1.5; }
        .gpx-info strong { color: #2c3e50; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. 初始化地圖
        const map = L.map('map').setView([23.8, 120.9], 8); 

        // 2. 定義底圖
        const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        });

        streetLayer.addTo(map);

        const baseMaps = {
            "一般地圖": streetLayer,
            "衛星地圖": satelliteLayer
        };
        L.control.layers(baseMaps).addTo(map);

        // --- 3. 自動抓取 GPX 檔案列表 ---
        const githubUser = 'MetalBao'; 
        const repoName = 'biketracks';

        async function loadAndDrawGPX() {
            const apiUrl = `https://api.github.com/repos/${githubUser}/${repoName}/contents/gpx`;
            
            try {
                const response = await fetch(apiUrl);
                const files = await response.json();

                const gpxFiles = files
                    .filter(file => file.name.toLowerCase().endsWith('.gpx'))
                    .map(file => `gpx/${file.name}`);

                gpxFiles.forEach(file => {
                    new L.GPX(file, {
                        async: true,
                        markers: { startIcon: null, endIcon: null, wptIcon: null }, // 隱藏水滴
                        polyline_options: {
                            color: '#4169E1', // 寶藍色
                            weight: 6,
                            opacity: 0.9
                        }
                    }).on('loaded', function(e) {
                        const gpxLayer = e.target;
                        
                        // --- 核心：點擊事件 ---
                        gpxLayer.on('click', function() {
                            
                            // 1. 抓取名稱 (使用最安全的 try-catch 避免報錯)
                            let name = '未命名路線';
                            try {
                                const tracks = gpxLayer.get_track_names();
                                if (tracks && tracks.length > 0) {
                                    name = tracks[0];
                                } else {
                                    name = file.split('/').pop().replace('.gpx', '');
                                }
                            } catch (err) {
                                name = file.split('/').pop().replace('.gpx', ''); // 備用檔名
                            }

                            // 2. 抓取距離與爬升
                            const distance = gpxLayer.get_distance() || 0; 
                            const elevationGain = gpxLayer.get_elevation_gain() || 0; 

                            const distKm = (distance / 1000).toFixed(2);
                            const elevStr = elevationGain > 0 ? elevationGain.toFixed(0) + ' 公尺' : '無資料';

                            // 3. 因為精簡工具可能刪除了時間，所以我們直接用安全的寫法抓取
                            let timeStr = '無時間紀錄';
                            let speedStr = '無資料';

                            try {
                                // 如果外掛有抓到時間，才計算
                                const startTime = gpxLayer.get_start_time(); 
                                const endTime = gpxLayer.get_end_time();     
                                
                                if (startTime && endTime && endTime > startTime) {
                                    let totalTime = (endTime.getTime() - startTime.getTime()) / 1000;
                                    
                                    // 防呆：小於 24 小時才計算
                                    if (totalTime > 0 && totalTime < 86400) {
                                        timeStr = formatTime(totalTime);
                                        const hours = totalTime / 3600;
                                        speedStr = (distKm / hours).toFixed(1) + ' km/h';
                                    }
                                }
                            } catch (err) {
                                // 如果抓時間發生錯誤，就維持顯示無時間紀錄
                            }

                            // 4. 組合彈窗
                            const popupContent = `
                                <div class="gpx-info">
                                    <h3>${name}</h3>
                                    <p><strong>總距離：</strong> ${distKm} 公里</p>
                                    <p><strong>總爬升：</strong> ${elevStr}</p>
                                    <p><strong>平均速度：</strong> ${speedStr}</p>
                                    <p><strong>移動時間：</strong> ${timeStr}</p>
                                </div>
                            `;
                            
                            // 綁定並打開彈窗
                            gpxLayer.bindPopup(popupContent).openPopup();
                        });

                        gpxLayer.addTo(map);
                    });
                });

            } catch (error) {
                console.error('無法讀取 GPX 列表:', error);
            }
        }

        loadAndDrawGPX();

        // 時間格式化
        function formatTime(seconds) {
            if (!seconds) return '無資料';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return hours > 0 ? `${hours} 小時 ${minutes} 分鐘` : `${minutes} 分鐘`;
        }
    </script>
</body>
</html>
